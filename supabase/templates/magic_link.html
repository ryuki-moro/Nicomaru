<h2>にこまる ワンタイムコード</h2>
<p>ログイン画面に次の6桁のコードを入力してください。</p>
<p style="font-size: 24px; letter-spacing: 4px"><strong>{{ .Token }}</strong></p>
<p>このコードの有効期限は1時間です。心当たりがない場合は、このメールを破棄してください。</p>
<p>
  <a href="{{ .RedirectTo }}#e={{ .Email }}&amp;c={{ .Token }}">リンクからログインする</a>
</p>
<p>リンクを開いたあと、画面の「ログインする」を押すとログインできます。</p>
