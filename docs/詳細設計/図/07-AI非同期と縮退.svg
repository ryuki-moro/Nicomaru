<rect x="40" y="140" width="280" height="105" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="54" y="166" font-size="17" fill="#993556">画面 / 業務イベント</text>
<text x="54" y="192" font-size="14" fill="#2C2C2A">必要最小限の入力を整形</text>
<text x="54" y="212" font-size="14" fill="#2C2C2A">要求を同期推論で待たせない</text>
<rect x="445" y="140" width="315" height="105" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="459" y="166" font-size="17" fill="#993556">queued</text>
<text x="459" y="192" font-size="14" fill="#2C2C2A">worker専用RPCで取得</text>
<text x="459" y="212" font-size="14" fill="#2C2C2A">promptはDB設定から解決</text>
<rect x="880" y="140" width="280" height="105" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="894" y="166" font-size="17" fill="#993556">processing</text>
<text x="894" y="192" font-size="14" fill="#2C2C2A">Ollama / JSON検証</text>
<text x="894" y="212" font-size="14" fill="#2C2C2A">30秒周期のpull</text>
<rect x="445" y="365" width="315" height="110" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="459" y="391" font-size="17" fill="#993556">done</text>
<text x="459" y="417" font-size="14" fill="#2C2C2A">出力は下書き / 候補</text>
<text x="459" y="437" font-size="14" fill="#2C2C2A">confirmed または discarded</text>
<rect x="880" y="365" width="280" height="110" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="894" y="391" font-size="17" fill="#993556">人の確認・修正</text>
<text x="894" y="417" font-size="14" fill="#2C2C2A">分類/文面/準備シート/起票案</text>
<text x="894" y="437" font-size="14" fill="#2C2C2A">自動送信・自動承認しない</text>
<rect x="40" y="590" width="280" height="110" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="54" y="616" font-size="17" fill="#993556">滞留回収</text>
<text x="54" y="642" font-size="14" fill="#2C2C2A">30分超のprocessingを回収</text>
<text x="54" y="662" font-size="14" fill="#2C2C2A">attempts &lt; 3ならqueuedへ</text>
<rect x="445" y="590" width="315" height="110" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="459" y="616" font-size="17" fill="#993556">failed / 利用不可</text>
<text x="459" y="642" font-size="14" fill="#2C2C2A">上限到達、設定不足等を表示</text>
<text x="459" y="662" font-size="14" fill="#2C2C2A">心拍10分超で補助利用不可</text>
<rect x="880" y="590" width="280" height="110" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="894" y="616" font-size="17" fill="#993556">通常操作を継続</text>
<text x="894" y="642" font-size="14" fill="#2C2C2A">手入力・確認・提出・通知は利用可</text>
<text x="894" y="662" font-size="14" fill="#2C2C2A">AIの停止で主導線を止めない</text>
<text x="40" y="770" font-size="13" fill="#2C2C2A">FAQ/RAG、リスケジュール案、引継ぎサマリー、セット提案、翻訳は条件付き拡張で今回対象外。</text>
