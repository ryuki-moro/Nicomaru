<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img">
<title>05  招待の利用可能条件と利用者の状態</title>
<style>text{font-family:Meiryo,"Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="1200" height="850" rx="6" fill="#F7F5F0" stroke="#F7F5F0"/>
<text x="36" y="43" font-size="27" fill="#993556">05  招待の利用可能条件と利用者の状態</text>
<text x="36" y="77" font-size="13" fill="#5F5E5A">招待にはstatus列を足さず、期限・回数・取消列から状態を導出する。</text>
<polyline points="36,94 1164,94" fill="none" stroke="#D3D1C7" stroke-width="1.5"/>
<text x="36" y="823" font-size="11" fill="#5F5E5A">にこまる | 実装連動の詳細設計 | 2026-10-09 | 学校発表・模擬データ用</text>
<text x="1120" y="823" font-size="12" fill="#5F5E5A">05</text>
<polyline points="330,197.0 390.0,197.0 390.0,197.0 450,197.0" fill="none" stroke="#89857B" stroke-width="1.5"/>
<polygon points="450,197.0 441.8959760788259,200.91468980700108 441.8959760788259,193.08531019299892" fill="#89857B"/>
<rect x="385.0" y="180.0" width="53.65087890625" height="20" rx="6" fill="#F7F5F0" stroke="#F7F5F0"/>
<text x="390.0" y="195.0" font-size="11" fill="#5F5E5A">URL利用</text>
<polyline points="760,197.0 820.0,197.0 820.0,197.0 880,197.0" fill="none" stroke="#89857B" stroke-width="1.5"/>
<polygon points="880,197.0 871.8959760788259,200.91468980700108 871.8959760788259,193.08531019299892" fill="#89857B"/>
<rect x="815.0" y="180.0" width="54.0" height="20" rx="6" fill="#F7F5F0" stroke="#F7F5F0"/>
<text x="820.0" y="195.0" font-size="11" fill="#5F5E5A">条件一致</text>
<polyline points="185.0,249 185.0,314.5 185.0,314.5 185.0,380" fill="none" stroke="#89857B" stroke-width="1.5"/>
<polygon points="185.0,380 181.08531019299892,371.8959760788259 188.91468980700108,371.8959760788259" fill="#89857B"/>
<rect x="180.0" y="297.5" width="58.94140625" height="20" rx="6" fill="#F7F5F0" stroke="#F7F5F0"/>
<text x="185.0" y="312.5" font-size="11" fill="#5F5E5A">時間/取消</text>
<polyline points="760,432.0 820.0,432.0 820.0,432.0 880,432.0" fill="none" stroke="#89857B" stroke-width="1.5"/>
<polygon points="880,432.0 871.8959760788259,435.9146898070011 871.8959760788259,428.0853101929989" fill="#89857B"/>
<rect x="815.0" y="415.0" width="54.0" height="20" rx="6" fill="#F7F5F0" stroke="#F7F5F0"/>
<text x="820.0" y="430.0" font-size="11" fill="#5F5E5A">設定完了</text>
<polyline points="1020.0,484 1020.0,547.0 605.0,547.0 605.0,610" fill="none" stroke="#89857B" stroke-width="1.5"/>
<polygon points="605.0,610 601.0853101929989,601.8959760788259 608.9146898070011,601.8959760788259" fill="#89857B"/>
<rect x="1015.0" y="530.0" width="32.0" height="20" rx="6" fill="#F7F5F0" stroke="#F7F5F0"/>
<text x="1020.0" y="545.0" font-size="11" fill="#5F5E5A">停止</text>
<polyline points="1020.0,484 1020.0,547.0 1020.0,547.0 1020.0,610" fill="none" stroke="#89857B" stroke-width="1.5"/>
<polygon points="1020.0,610 1016.0853101929989,601.8959760788259 1023.9146898070011,601.8959760788259" fill="#89857B"/>
<rect x="1015.0" y="530.0" width="32.0" height="20" rx="6" fill="#F7F5F0" stroke="#F7F5F0"/>
<text x="1020.0" y="545.0" font-size="11" fill="#5F5E5A">削除</text>
<rect x="40" y="145" width="290" height="104" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="54" y="171" font-size="17" fill="#993556">招待発行</text>
<text x="54" y="197" font-size="14" fill="#2C2C2A">token_hashのみ保存</text>
<text x="54" y="217" font-size="14" fill="#2C2C2A">平文URLは発行応答の1回のみ</text>
<rect x="450" y="145" width="310" height="104" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="464" y="171" font-size="17" fill="#993556">consume_invitation</text>
<text x="464" y="197" font-size="14" fill="#2C2C2A">purpose / expires_at / revoked_at</text>
<text x="464" y="217" font-size="14" fill="#2C2C2A">use_count &lt; max_uses</text>
<rect x="880" y="145" width="280" height="104" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="894" y="171" font-size="17" fill="#993556">登録・消費</text>
<text x="894" y="197" font-size="14" fill="#2C2C2A">Auth / profileを作成</text>
<text x="894" y="217" font-size="14" fill="#2C2C2A">失敗はrestore_invitation</text>
<rect x="40" y="380" width="290" height="104" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="54" y="406" font-size="17" fill="#993556">期限切れ / 失効 / 上限</text>
<text x="54" y="432" font-size="14" fill="#2C2C2A">消費不可。K02で再発行</text>
<text x="54" y="452" font-size="14" fill="#2C2C2A">旧URLを再び有効にしない</text>
<rect x="450" y="380" width="310" height="104" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="464" y="406" font-size="17" fill="#993556">invited</text>
<text x="464" y="432" font-size="14" fill="#2C2C2A">初回パスワード設定待ち</text>
<text x="464" y="452" font-size="14" fill="#2C2C2A">業務RLSのactive条件を満たさない</text>
<rect x="880" y="380" width="280" height="104" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="894" y="406" font-size="17" fill="#993556">active</text>
<text x="894" y="432" font-size="14" fill="#2C2C2A">業務操作可能</text>
<text x="894" y="452" font-size="14" fill="#2C2C2A">venue / caseのRLSは引き続き適用</text>
<rect x="450" y="610" width="310" height="104" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="464" y="636" font-size="17" fill="#993556">suspended</text>
<text x="464" y="662" font-size="14" fill="#2C2C2A">管理者が停止 / 復帰</text>
<text x="464" y="682" font-size="14" fill="#2C2C2A">担当引継ぎを確認</text>
<rect x="880" y="610" width="280" height="104" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="894" y="636" font-size="17" fill="#993556">deleted</text>
<text x="894" y="662" font-size="14" fill="#2C2C2A">論理削除</text>
<text x="894" y="682" font-size="14" fill="#2C2C2A">認証済みでも業務APIは拒否</text>
<text x="40" y="774" font-size="14" fill="#2C2C2A">公開APIもOrigin・レート制限を維持。アカウントの存在を認証エラー文言から推測できないようにする。</text>
</svg>