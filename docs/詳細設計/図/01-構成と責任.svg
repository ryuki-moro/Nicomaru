<text x="50" y="182" font-size="14" fill="#2C2C2A">couple / planner / admin</text>
<text x="50" y="202" font-size="14" fill="#2C2C2A">Service Workerは機微情報を保存しない</text>
<rect x="434" y="130" width="330" height="115" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="448" y="156" font-size="17" fill="#993556">Next.js / Vercel</text>
<text x="448" y="182" font-size="14" fill="#2C2C2A">画面・入力検証・認証・Origin検証</text>
<text x="448" y="202" font-size="14" fill="#2C2C2A">RLSクライアントによる読み書き</text>
<rect x="855" y="130" width="310" height="115" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="869" y="156" font-size="17" fill="#993556">Supabase Auth</text>
<text x="869" y="182" font-size="14" fill="#2C2C2A">OTP / パスワード / セッション</text>
<text x="869" y="202" font-size="14" fill="#2C2C2A">activeプロフィールと照合</text>
<rect x="434" y="355" width="330" height="115" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="448" y="381" font-size="17" fill="#993556">Supabase DB / Storage</text>
<text x="448" y="407" font-size="14" fill="#2C2C2A">RPCの原子性 + RLSの行境界</text>
<text x="448" y="427" font-size="14" fill="#2C2C2A">非公開ファイル + 短命署名URL</text>
<rect x="855" y="355" width="310" height="115" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="869" y="381" font-size="17" fill="#993556">LINE / Resend</text>
<text x="869" y="407" font-size="14" fill="#2C2C2A">通知本文を外部へ送信する専用出口</text>
<text x="869" y="427" font-size="14" fill="#2C2C2A">送信結果・上限・代替を管理</text>
<rect x="36" y="355" width="305" height="115" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="50" y="381" font-size="17" fill="#993556">pg_cron / GitHub Actions</text>
<text x="50" y="407" font-size="14" fill="#2C2C2A">定期登録 + 共有secret認証</text>
<text x="50" y="427" font-size="14" fill="#2C2C2A">容量・監視・削除・通知・回収</text>
<rect x="434" y="580" width="330" height="115" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="448" y="606" font-size="17" fill="#993556">校内・自宅のAI worker</text>
<text x="448" y="632" font-size="14" fill="#2C2C2A">専用DBロールでpull / 30秒周期</text>
<text x="448" y="652" font-size="14" fill="#2C2C2A">Service Roleを渡さない</text>
<rect x="855" y="580" width="310" height="115" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="869" y="606" font-size="17" fill="#993556">Ollama（ローカル）</text>
<text x="869" y="632" font-size="14" fill="#2C2C2A">必要な最小入力 / JSON出力</text>
<text x="869" y="652" font-size="14" fill="#2C2C2A">人が確認・修正して採用</text>
<text x="40" y="749" font-size="14" fill="#2C2C2A">学校の最終発表・デモが対象。常時本番運用/商用SLAは今回の予定に含めない。</text>
