<polygon points="820,508 811.8959760788259,511.9146898070011 811.8959760788259,504.0853101929989" fill="#89857B"/>
<text x="356" y="501" font-size="11" fill="#2C2C2A">Auth作成 → 失敗時はrestore_invitation</text>
<polyline points="1055,550 350,550" fill="none" stroke="#89857B" stroke-width="1.5"/>
<polygon points="350,550 358.1040239211741,546.0853101929989 358.1040239211741,553.9146898070011" fill="#89857B"/>
<text x="356" y="543" font-size="11" fill="#2C2C2A">提出（ファイルは先にStorageへ）</text>
<polyline points="350,592 585,592" fill="none" stroke="#89857B" stroke-width="1.5"/>
<polygon points="585,592 576.8959760788259,595.9146898070011 576.8959760788259,588.0853101929989" fill="#89857B"/>
<text x="356" y="585" font-size="11" fill="#2C2C2A">submit_task_atomic / 最新提出を更新</text>
<polyline points="115,634 350,634" fill="none" stroke="#89857B" stroke-width="1.5"/>
<polygon points="350,634 341.8959760788259,637.9146898070011 341.8959760788259,630.0853101929989" fill="#89857B"/>
<text x="121" y="627" font-size="11" fill="#2C2C2A">確認 または 不備コメント</text>
<polyline points="350,676 585,676" fill="none" stroke="#89857B" stroke-width="1.5"/>
<polygon points="585,676 576.8959760788259,679.9146898070011 576.8959760788259,672.0853101929989" fill="#89857B"/>
<text x="356" y="669" font-size="11" fill="#2C2C2A">review_submission: 競合検査・状態更新</text>
<text x="36" y="779" font-size="14" fill="#2C2C2A">不備ありは再提出へ。AI案は任意の補助であり、提出/確認/通知の確定を自動代行しない。</text>
</svg>