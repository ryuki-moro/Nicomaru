<text x="724" y="652" font-size="14" fill="#2C2C2A">最新提出ポインタをRPCで競合制御</text>
<text x="40" y="742" font-size="14" fill="#2C2C2A">旧提出の確認操作は最新状態と照合し409を返す。画面だけで状態を更新せずRPCを正本とする。</text>
