<rect x="40" y="140" width="280" height="110" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="54" y="166" font-size="17" fill="#993556">notifications: queued</text>
<text x="54" y="192" font-size="14" fill="#2C2C2A">新規通知 / 日次リマインド</text>
<text x="54" y="212" font-size="14" fill="#2C2C2A">アプリ内通知は外部送信なし</text>
<rect x="445" y="140" width="315" height="110" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="459" y="166" font-size="17" fill="#993556">チャネル選択</text>
<text x="459" y="192" font-size="14" fill="#2C2C2A">LINE紐付け + overdue / needs_fix</text>
<text x="459" y="212" font-size="14" fill="#2C2C2A">案件あり + claim_line_quota成功</text>
<rect x="880" y="140" width="280" height="110" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="894" y="166" font-size="17" fill="#993556">LINE送信</text>
<text x="894" y="192" font-size="14" fill="#2C2C2A">送信枠内の重要通知</text>
<rect x="445" y="365" width="315" height="110" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="459" y="391" font-size="17" fill="#993556">メールへ代替</text>
<text x="459" y="417" font-size="14" fill="#2C2C2A">未紐付け / 上限 / 対象外</text>
<text x="459" y="437" font-size="14" fill="#2C2C2A">Resend構成と送信結果を確認</text>
<rect x="880" y="365" width="280" height="110" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="894" y="391" font-size="17" fill="#993556">sent / failed</text>
<text x="894" y="417" font-size="14" fill="#2C2C2A">notification_logsに結果</text>
<text x="894" y="437" font-size="14" fill="#2C2C2A">switch reasonを残す</text>
<rect x="40" y="590" width="315" height="115" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="54" y="616" font-size="17" fill="#993556">定期登録</text>
<text x="54" y="642" font-size="14" fill="#2C2C2A">register_scheduled_jobs</text>
<text x="54" y="662" font-size="14" fill="#2C2C2A">アプリURL更新で登録し直す</text>
<rect x="445" y="590" width="315" height="115" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="459" y="616" font-size="17" fill="#993556">内部API認証</text>
<text x="459" y="642" font-size="14" fill="#2C2C2A">x-internal-cron-secret必須</text>
<text x="459" y="662" font-size="14" fill="#2C2C2A">ユーザーCookieに依存しない</text>
<rect x="880" y="590" width="280" height="115" rx="6" fill="white" stroke="#D3D1C7"/>
<text x="894" y="616" font-size="17" fill="#993556">batch_runs / system_alerts</text>
<text x="894" y="642" font-size="14" fill="#2C2C2A">開始・終了・件数・失敗段階</text>
<text x="894" y="662" font-size="14" fill="#2C2C2A">監視条件の重複/復旧を管理</text>
<text x="40" y="755" font-size="13" fill="#2C2C2A">通知の送信失敗は記録し運用で再操作。LINEプロバイダ障害を無条件にメール再送する設計ではない。</text>
</svg>