# 死活監視（6-12）。
#
# 「Supabase Free はアクセスが無いとプロジェクトが一時停止され、停止すると pg_cron 自体も
#   動かず自分を起こせない。そのため死活監視（定期アクセス）だけは pg_cron 一本化の例外とし、
#   GitHub Actions の schedule から Supabase 外部より API を叩く構成とする」（6-5-2／6-12）
#
#   契機・頻度   : 6時間ごと
#   対象範囲     : プロジェクト全体（軽量な GET 1本）
#   失敗時の扱い : 連続失敗で開発チームへ通知
#   失敗の検知先 : GitHub Actions の失敗通知
name: Keepalive

on:
  schedule:
    # 6時間ごと（UTC）。pg_cron を止めないことが目的なので時刻に意味は無い
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # APP_BASE_URL が未設定のリポジトリでは何もしない（fork や検証用クローン向け）
      - name: Ping
        if: ${{ vars.APP_BASE_URL != '' }}
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          set -euo pipefail
          # 一過性の接続失敗で警告せず、10秒間隔で2回連続した失敗をCI通知へつなぐ。
          # DB不通時はDB自身に記録できないため、この外部監視が検知先となる。
          # 失敗時に「何が返ったか」をログへ残す。ステータスコードも応答本文も記録せずに
          # 落とすと、障害時にジョブログから原因（503か接続不可か等）を切り分けられない
          # （2026-10-22〜の連続失敗で実際に切り分けられなかった）。/api/health の応答は
          # {ok: true/false} だけで秘密情報を含まないため、そのまま記録してよい。
          body_file=$(mktemp)
          err_file=$(mktemp)
          last_status=""
          last_detail=""
          for attempt in 1 2; do
            status=$(curl -sS -o "$body_file" -w '%{http_code}' --max-time 30 \
              "${APP_BASE_URL%/}/api/health" 2>"$err_file" || true)
            if [ "$status" = "200" ]; then
              echo "Keepalive succeeded (attempt $attempt, HTTP $status)"
              exit 0
            fi
            last_status="$status"
            last_detail="body: $(cat "$body_file")"
            err_text=$(cat "$err_file")
            if [ -n "$err_text" ]; then
              last_detail="$last_detail / curl: $err_text"
            fi
            echo "Keepalive failed (attempt $attempt, HTTP ${status:-none}) - $last_detail"
            if [ "$attempt" = "1" ]; then sleep 10; fi
          done
          echo "::error::Keepalive failed twice consecutively (last HTTP ${last_status:-none}). $last_detail - Check the application and Supabase status."
          exit 1
