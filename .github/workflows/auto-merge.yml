# CI（必須チェック verify・e2e・security）が通ったPRを自動でマージする。
#
#   - 対象: main 向け・下書きでない・このリポジトリ内のブランチ（フォーク除外）・「マージ保留」ラベルなし
#   - マージ方法は merge commit（PR内のコミットを1変更単位のまま残す）
#   - main が進んで遅れたPR（BEHIND）は main を取り込み、CIを起動し直す
#     （GITHUB_TOKEN の push では pull_request が発火しないため workflow_dispatch で起動する）
#   - 1回の実行でマージするのは1本だけ。残りは main を取り込み、次のCI完了で再判定する
#   - CI完了時に加え、30分ごとにも見回る（Dependabot起点やラベル変更の取りこぼし対策）
name: 自動マージ

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Merge passing PRs
        shell: bash
        run: |
          set -euo pipefail
          merged=""
          prs=$(gh pr list --state open --base main --limit 50 \
            --json number,isDraft,isCrossRepository,labels,mergeStateStatus,headRefName,headRefOid \
            --jq '.[] | select((.isDraft or .isCrossRepository) | not)
                      | select([.labels[].name] | index("マージ保留") | not)
                      | "\(.number) \(.mergeStateStatus) \(.headRefName) \(.headRefOid)"')

          while read -r num state branch sha; do
            [ -n "${num:-}" ] || continue
            if [ -z "$merged" ] && [ "$state" = "CLEAN" ]; then
              if gh pr merge "$num" --merge --match-head-commit "$sha"; then
                echo "::notice::#$num をマージしました"
                merged="$num"
                continue
              fi
              echo "::warning::#$num のマージに失敗しました"
            fi
            # マージ後は他のPRが遅れるため、CLEAN だったものも取り込み対象にする
            if [ "$state" = "BEHIND" ] || { [ -n "$merged" ] && [ "$state" = "CLEAN" ]; }; then
              if gh api -X PUT "repos/$GH_REPO/pulls/$num/update-branch" -f expected_head_sha="$sha" >/dev/null; then
                # update-branch は非同期のため、先頭コミットが変わってからCIを起動する
                for _ in $(seq 1 15); do
                  [ "$(gh pr view "$num" --json headRefOid --jq .headRefOid)" != "$sha" ] && break
                  sleep 2
                done
                gh workflow run ci.yml --ref "$branch"
                echo "#$num に main を取り込み、CIを起動しました"
              else
                echo "::warning::#$num のブランチ更新に失敗しました（衝突の可能性）"
              fi
            else
              echo "#$num: $state のため見送り"
            fi
          done <<< "$prs"
