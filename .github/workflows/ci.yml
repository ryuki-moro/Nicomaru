# 正本: 基本設計書 Version 1.2 12章「CI/CD」・12-2「テストゲート」。
# lint・型チェック・テストの全通過をマージ条件とする。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Progress consistency
        run: npm run progress:check

      - name: Typecheck
        run: npm run typecheck

      # RLS テストを含む。PGlite 上で本番と同じマイグレーションを流して
      # 42P17・権限昇格・アーカイブ・停止利用者の退行を機械検出する（11章／12-2）
      - name: Test
        run: npm run test

      - name: Core branch coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build

  # PGlite は単一接続のため並行性を検証できない。
  # 設計が明示する原子性（招待トークンの消費・レート制限・採番競合）は
  # 実サーバーへ同時接続して確かめる（6-6-1／5-3／5-7／6-7）。
  concurrency-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit

      - name: Concurrency tests
        run: npm run test:pg
        env:
          TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

  # 12-2 結合テスト（Issue #19）。GitHub Actions 上にローカル Supabase を立て、
  # ビルド済みのアプリをブラウザで通しで操作する（tests/e2e/）。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Studio・画像変換・Edge Functions・ログ基盤はテストに不要なので起動しない（時間短縮）
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      # このCIだけの使い捨てDB。公開用migrationには管理者メンバーシップを追加しない。
      # 専用ロールへSET ROLEした後、E2E内でテーブル直接アクセス拒否も確認する。
      - name: Allow fixture connection to assume AI worker role
        run: docker exec supabase_db_Nicomaru psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c 'GRANT ai_worker TO postgres;'

      # ローカルスタックの接続情報を以降のステップへ渡す。
      # 鍵はローカル専用の既知の値で、外部には接続できない。
      - name: Export local Supabase settings
        shell: bash
        run: |
          supabase status -o env > supabase-status.env
          value() { grep "^$1=" supabase-status.env | head -n1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//'; }
          MAIL_URL="$(value MAILPIT_URL)"; [ -n "$MAIL_URL" ] || MAIL_URL="$(value INBUCKET_URL)"
          # 新しい CLI は JWT 形式の鍵に加えて sb_publishable_/sb_secret_ 形式も出す。無い方を補う
          ANON="$(value ANON_KEY)"; [ -n "$ANON" ] || ANON="$(value PUBLISHABLE_KEY)"
          SERVICE="$(value SERVICE_ROLE_KEY)"; [ -n "$SERVICE" ] || SERVICE="$(value SECRET_KEY)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(value API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
            echo "E2E_AI_DATABASE_URL=$(value DB_URL)"
            echo "E2E_MAIL_URL=${MAIL_URL:-http://127.0.0.1:54324}"
            echo "PII_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "PII_HMAC_KEY=$(openssl rand -base64 32)"
            echo "INTERNAL_CRON_SECRET=$(openssl rand -hex 16)"
            echo "APP_BASE_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"
          rm supabase-status.env

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # NEXT_PUBLIC_* はビルド時にクライアントへ埋め込まれるため、接続情報を書き出した後にビルドする
      - name: Build
        id: e2e-build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: 300 cases and 30 concurrent users
        if: ${{ !cancelled() && steps.e2e-build.outcome == 'success' }}
        run: npx playwright test performance-load --project=chromium --output=performance-results
        env:
          E2E_RUN_PERFORMANCE: '1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: performance-report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            performance-results/
            performance-report/
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit

      # npm 10 は監査API失敗時に廃止予定の Quick Audit API へフォールバックする。
      - name: Use current npm audit client
        run: npm install --global npm@11

      # 12-2 依存脆弱性管理: high 以上を必須ゲートにする
      - name: Dependency audit
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high --fetch-retries=0 --fetch-timeout=30000; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done

          exit 1

      # 12-2 秘密情報の保護: 実キーの混入を検出する
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
