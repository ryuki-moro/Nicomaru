# 正本: 基本設計書 Version 1.2 12章「CI/CD」・12-2「テストゲート」。
# lint・型チェック・テストの全通過をマージ条件とする。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Progress consistency
        run: npm run progress:check

      - name: Typecheck
        run: npm run typecheck

      # 純ロジックとD1経路の退行を検証する。
      - name: Test
        run: npm run test

      - name: D1 local tests
        run: npm run test:d1

      - name: Core branch coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: core-coverage
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build

  # 12-2 結合テスト。本番と同じD1経路をローカルD1（wrangler）で立て、
  # 4ロールの権限・案件登録〜招待〜初回登録・宿題の提出〜確認をChromiumで通しで操作する（tests/d1/*.browser.mjs）。
  # 必須チェック名に合わせてジョブ名は e2e のままにする。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # migration適用・検証用アカウント作成のあと、127.0.0.1:3104 で起動する
      - name: Start local D1 app
        shell: bash
        run: |
          nohup npm run dev:d1 > d1-server.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:3104/login; then exit 0; fi
            sleep 2
          done
          cat d1-server.log
          exit 1

      - name: D1 browser tests
        run: npm run test:d1:browser

      - name: Upload D1 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d1-browser-evidence
          path: |
            .wrangler/app-local/evidence/
            d1-server.log
          include-hidden-files: true
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit

      # npm 10 は監査API失敗時に廃止予定の Quick Audit API へフォールバックする。
      - name: Use current npm audit client
        run: npm install --global npm@11

      # 12-2 依存脆弱性管理: high 以上を必須ゲートにする
      - name: Dependency audit
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high --fetch-retries=0 --fetch-timeout=30000; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done

          exit 1

      # 12-2 秘密情報の保護: 実キーの混入を検出する
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
