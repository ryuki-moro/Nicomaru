# 正本: 基本設計書 Version 1.2 12章「CI/CD」・12-2「テストゲート」。
# lint・型チェック・テストの全通過をマージ条件とする。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # RLS テストを含む。PGlite 上で本番と同じマイグレーションを流して
      # 42P17・権限昇格・アーカイブ・停止利用者の退行を機械検出する（11章／12-2）
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # PGlite は単一接続のため並行性を検証できない。
  # 設計が明示する原子性（招待トークンの消費・レート制限・採番競合）は
  # 実サーバーへ同時接続して確かめる（6-6-1／5-3／5-7／6-7）。
  concurrency-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Concurrency tests
        run: npm run test:pg
        env:
          TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # npm 10 は監査API失敗時に廃止予定の Quick Audit API へフォールバックする。
      - name: Use current npm audit client
        run: npm install --global npm@11

      # 12-2 依存脆弱性管理: high 以上を必須ゲートにする
      - name: Dependency audit
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done

          exit 1

      # 12-2 秘密情報の保護: 実キーの混入を検出する
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
